[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-grupo06"
version = "0.1.0"
description = "Sistema de detección de spam (Spambase) con red neuronal, API FastAPI, chatbot y traducción automática"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Grupo 06 - Tecnologías Emergentes (ISO46B)" }
]

dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "streamlit>=1.25.0",
    "deep-translator>=1.11.4",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "pycodestyle>=2.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]